# ==============================
# Зимний режим
# ==============================
winter:
  # По умолчанию выключен для безопасного первого запуска.
  enabled: false

  # На этой координате Y и выше животные получают урон.
  # Ниже этой координаты урона от холода нет.
  cold-y: 50

  # Урон за один проход обработки животных.
  # 2 единицы урона = 1 сердце.
  animal-damage: 2.0

# ==============================
# Остановка тиков
# ==============================
freeze:
  # Автоматическое чередование остановки и возобновления.
  auto: false

  # Время от разморозки до следующей остановки.
  interval-seconds: 300

  # Длительность автоматической остановки.
  duration-seconds: 10

# ==============================
# Снегопад
# ==============================
snow:
  # Целевая толщина для разового покрытия.
  # 8 слоёв = высота одного блока.
  layers: 8

  # Постоянное постепенное накопление снега.
  long: false

  # Максимальная толщина для долгого снегопада.
  max-layers: 32

# ==============================
# Радиусы источников тепла
# ==============================
# Радиус в блоках: от 0 до 8.
# 0 отключает источник.
# В этой версии тепло проходит через стены.
heat:
  torch: 3
  lantern: 3
  fire: 4
  campfire: 4
  lava: 5
  magma: 2
  furnace: 3
  candle: 1
  soul: 1

# ==============================
# Производительность
# ==============================
performance:
  # Количество вертикальных колонок карты,
  # обрабатываемых за один проход задачи.
  # При нагрузке фактическая частота проходов снижается.
  columns-per-second: 24